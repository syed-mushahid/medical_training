services:
  # MySQL Database Service for Training Portal
  db:
    image: mysql:8.0
    container_name: training-portal-db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_NAME:-training_portal}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - training-portal-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: training-portal-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-training_portal}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://46.224.35.114:80}
      RAGFLOW_API_KEY: ${RAGFLOW_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://46.224.35.114:3000}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - training-portal-network
    command: sh -c "sleep 5 && python init_db.py && python app.py"

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://46.224.35.114:5000/api}
        - VITE_FRONTEND_URL=${FRONTEND_URL:-http://46.224.35.114:3000}
        - VITE_RAGFLOW_BASE_URL=${RAGFLOW_BASE_URL:-http://46.224.35.114:80}
    container_name: training-portal-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - training-portal-network

volumes:
  mysql_data:
    driver: local

networks:
  training-portal-network:
    driver: bridge

